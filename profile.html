<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTLS — Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#050914;
    --card:#0b1428;
    --card2:#0e1930;
    --blue:#1767ff;
    --blue2:#4d8dff;
    --text:#fff;
    --muted:#8e9bb5;
    --border:rgba(255,255,255,.08);
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(23,103,255,.16),transparent 35%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* NAVBAR */

header{
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid var(--border);
    background:rgba(5,9,20,.85);
    backdrop-filter:blur(18px);
}

.nav{
    max-width:1100px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo img{
    width:40px;
    height:40px;
    object-fit:cover;
    border-radius:10px;
}

.back{
    color:#9db9ff;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.back:hover{
    color:#fff;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

/* PROFILE */

.profile-card{
    background:
        linear-gradient(
            145deg,
            rgba(17,31,62,.95),
            rgba(7,13,28,.98)
        );
    border:1px solid rgba(77,141,255,.16);
    border-radius:24px;
    padding:32px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.4);
}

.profile-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.name{
    font-size:32px;
    font-weight:900;
    line-height:1.2;
}

.username{
    color:#709bff;
    margin-top:7px;
    font-size:14px;
}

.verified{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:16px;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(23,103,255,.16);
    border:1px solid rgba(77,141,255,.3);
    color:#70a1ff;
    font-size:12px;
    font-weight:800;
}

.role{
    margin-top:14px;
    color:#aab6cf;
    font-size:14px;
}

.status{
    display:inline-flex;
    margin-top:13px;
    padding:7px 12px;
    border-radius:999px;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.2);
    color:#4ade80;
    font-size:12px;
    font-weight:800;
}

.status.suspended{
    background:rgba(239,68,68,.1);
    border-color:rgba(239,68,68,.2);
    color:#f87171;
}

.description{
    margin-top:26px;
    color:#c3cee2;
    line-height:1.75;
    white-space:pre-wrap;
}

.whatsapp{
    display:inline-flex;
    margin-top:25px;
    padding:13px 20px;
    border-radius:12px;
    background:#168a4a;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:800;
    transition:.2s;
}

.whatsapp:hover{
    background:#1aaa5d;
    transform:translateY(-1px);
}

/* SECTION */

.section{
    margin-top:32px;
}

.section-title{
    font-size:23px;
    font-weight:900;
    margin-bottom:17px;
}

/* RATING */

.rating-summary{
    display:flex;
    align-items:center;
    gap:22px;
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
}

.average{
    font-size:40px;
    font-weight:900;
}

.stars{
    color:#ffc107;
    letter-spacing:2px;
    font-size:18px;
    margin-top:3px;
}

.review-count{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

/* REVIEW FORM */

.review-form{
    margin-top:18px;
    padding:22px;
    border-radius:18px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
}

.form-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#aab6cf;
    font-size:13px;
    font-weight:700;
}

input,
select,
textarea{
    width:100%;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    background:#080f20;
    color:#fff;
    border-radius:11px;
    padding:13px;
    margin-bottom:16px;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#367cff;
    box-shadow:0 0 0 3px rgba(23,103,255,.08);
}

textarea{
    min-height:115px;
    resize:vertical;
}

.submit-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    background:var(--blue);
    color:#fff;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.submit-btn:hover{
    background:#347aff;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.message.success{
    display:block;
    color:#4ade80;
    background:rgba(34,197,94,.1);
    border:1px solid rgba(34,197,94,.2);
}

.message.error{
    display:block;
    color:#f87171;
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.2);
}

/* REVIEWS */

#reviewsList{
    margin-top:18px;
}

.review{
    padding:18px;
    margin-bottom:12px;
    border-radius:16px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--border);
}

.review-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.reviewer{
    font-size:15px;
    font-weight:900;
}

.review-stars{
    color:#ffc107;
    margin-top:5px;
    letter-spacing:1px;
}

.date{
    color:#687692;
    font-size:12px;
    white-space:nowrap;
}

.review-text{
    margin-top:11px;
    color:#c3cee2;
    line-height:1.65;
    white-space:pre-wrap;
}

.empty{
    padding:30px 20px;
    text-align:center;
    color:#71809d;
    background:rgba(255,255,255,.025);
    border-radius:15px;
}

/* LOADING */

.loading{
    padding:90px 20px;
    text-align:center;
    color:#8e9bb5;
}

.spinner{
    width:35px;
    height:35px;
    margin:0 auto 15px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#347aff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ERROR */

.error-page{
    padding:80px 20px;
    text-align:center;
}

.error-page h2{
    margin-bottom:10px;
}

.error-page p{
    color:var(--muted);
}

/* MOBILE */

@media(max-width:600px){

    .container{
        margin:25px auto;
    }

    .profile-card{
        padding:22px;
        border-radius:20px;
    }

    .name{
        font-size:26px;
    }

    .rating-summary{
        align-items:flex-start;
    }

    .review-head{
        flex-direction:column;
        gap:5px;
    }

    .date{
        white-space:normal;
    }

}
</style>
</head>

<body>

<header>

    <div class="nav">

        <div class="logo">

            <img
                src="https://i.ibb.co/qMHWZRf3/photo-6113671142116627052-y.jpg"
                alt="MTLS"
            >

            <span>MTLS</span>

        </div>

        <a
            href="index.html"
            class="back"
        >
            ← Trusted List
        </a>

    </div>

</header>


<div class="container">

    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        Loading profile...

    </div>


    <!-- ERROR -->

    <div
        id="errorPage"
        class="error-page"
        style="display:none;"
    >

        <h2>Profile Not Found</h2>

        <p>
            This profile does not exist or has been removed.
        </p>

    </div>


    <!-- PROFILE -->

    <div
        id="profileContent"
        style="display:none;"
    >

        <div class="profile-card">

            <div class="profile-top">

                <div>

                    <div
                        class="name"
                        id="displayName"
                    >
                        -
                    </div>

                    <div
                        class="username"
                        id="username"
                    >
                        @-
                    </div>

                    <div id="verifiedBadge"></div>

                    <div
                        class="role"
                        id="role"
                    >
                        -
                    </div>

                    <div id="statusBadge"></div>

                </div>

            </div>


            <div
                class="description"
                id="description"
            >
                -
            </div>


            <a
                id="whatsappBtn"
                class="whatsapp"
                target="_blank"
                rel="noopener noreferrer"
            >
                WhatsApp
            </a>


            <!-- REVIEWS -->

            <div class="section">

                <div class="section-title">
                    Reviews
                </div>


                <!-- RATING SUMMARY -->

                <div class="rating-summary">

                    <div>

                        <div
                            class="average"
                            id="averageRating"
                        >
                            0.0
                        </div>

                        <div
                            class="stars"
                            id="averageStars"
                        >
                            ☆☆☆☆☆
                        </div>

                        <div
                            class="review-count"
                            id="reviewCount"
                        >
                            0 reviews
                        </div>

                    </div>

                </div>


                <!-- REVIEW FORM -->

                <div class="review-form">

                    <div class="form-title">
                        Leave a Review
                    </div>


                    <form id="reviewForm">

                        <label for="reviewerName">
                            Your Name
                        </label>

                        <input
                            id="reviewerName"
                            type="text"
                            maxlength="50"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >


                        <label for="rating">
                            Rating
                        </label>

                        <select
                            id="rating"
                            required
                        >

                            <option value="">
                                Select rating
                            </option>

                            <option value="5">
                                ★★★★★ — 5
                            </option>

                            <option value="4">
                                ★★★★☆ — 4
                            </option>

                            <option value="3">
                                ★★★☆☆ — 3
                            </option>

                            <option value="2">
                                ★★☆☆☆ — 2
                            </option>

                            <option value="1">
                                ★☆☆☆☆ — 1
                            </option>

                        </select>


                        <label for="reviewText">
                            Review
                        </label>

                        <textarea
                            id="reviewText"
                            maxlength="500"
                            placeholder="Write your experience..."
                            required
                        ></textarea>


                        <button
                            type="submit"
                            id="submitReview"
                            class="submit-btn"
                        >
                            Submit Review
                        </button>


                        <div
                            id="reviewMessage"
                            class="message"
                        ></div>

                    </form>

                </div>


                <!-- REVIEW LIST -->

                <div id="reviewsList"></div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://tmvqcmiyjknefaafitav.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_bUrV_nUC6hioAg8RW6XbEA_U436y-0S";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function normalizeWhatsApp(number){

    if(!number){
        return "";
    }

    let value =
        String(number)
            .replace(/\D/g,"");

    if(value.startsWith("0")){

        value =
            "6" + value;

    }

    if(!value.startsWith("6")){

        value =
            "60" + value;

    }

    return value;

}


function formatDate(date){

    if(!date){
        return "";
    }

    return new Date(date).toLocaleDateString(
        "en-MY",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


function getStars(rating){

    const rounded =
        Math.max(
            0,
            Math.min(
                5,
                Math.round(
                    Number(rating) || 0
                )
            )
        );

    return (
        "★".repeat(rounded) +
        "☆".repeat(5 - rounded)
    );

}


function showError(){

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "profileContent"
    ).style.display = "none";

    document.getElementById(
        "errorPage"
    ).style.display = "block";

}


/* =========================================
   GET PROFILE ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const profileId =
    params.get("id");


/* =========================================
   START
========================================= */

if(!profileId){

    showError();

}else{

    loadProfile();

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                username,
                display_name,
                role,
                whatsapp,
                description,
                verified,
                status,
                created_at
            `)
            .eq("id",profileId)
            .single();


    if(error || !profile){

        console.error(
            "Profile error:",
            error
        );

        showError();

        return;

    }


    document.getElementById(
        "displayName"
    ).textContent =
        profile.display_name ||
        profile.username ||
        "Unknown";


    document.getElementById(
        "username"
    ).textContent =
        "@" +
        (
            profile.username ||
            ""
        );


    document.getElementById(
        "role"
    ).textContent =
        "Role: " +
        (
            profile.role ||
            "MEMBER"
        );


    document.getElementById(
        "description"
    ).textContent =
        profile.description ||
        "No description available.";


    /* VERIFIED */

    if(profile.verified === true){

        document.getElementById(
            "verifiedBadge"
        ).innerHTML = `
            <span class="verified">
                ✓ Verified by MTLS
            </span>
        `;

    }


    /* STATUS */

    const status =
        String(
            profile.status || ""
        ).toUpperCase();


    const statusBadge =
        document.getElementById(
            "statusBadge"
        );


    if(status === "TRUSTED"){

        statusBadge.innerHTML = `
            <span class="status">
                ● TRUSTED
            </span>
        `;

    }else{

        statusBadge.innerHTML = `
            <span class="status suspended">
                ● ${escapeHTML(
                    status || "SUSPENDED"
                )}
            </span>
        `;

    }


    /* WHATSAPP */

    const phone =
        normalizeWhatsApp(
            profile.whatsapp
        );


    const whatsappBtn =
        document.getElementById(
            "whatsappBtn"
        );


    if(phone){

        whatsappBtn.href =
            "https://wa.me/" +
            phone;

    }else{

        whatsappBtn.style.display =
            "none";

    }


    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "profileContent"
    ).style.display = "block";


    await loadReviews();

}


/* =========================================
   LOAD APPROVED REVIEWS
========================================= */

async function loadReviews(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("reviews")
            .select(`
                id,
                reviewer_name,
                rating,
                review,
                created_at
            `)
            .eq(
                "profile_id",
                profileId
            )
            .eq(
                "status",
                "APPROVED"
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "Reviews error:",
            error
        );

        document.getElementById(
            "reviewsList"
        ).innerHTML = `
            <div class="empty">
                Unable to load reviews.
            </div>
        `;

        return;

    }


    const reviews =
        data || [];


    /* AVERAGE */

    let average = 0;


    if(reviews.length > 0){

        const total =
            reviews.reduce(
                function(sum,item){

                    return (
                        sum +
                        Number(
                            item.rating || 0
                        )
                    );

                },
                0
            );


        average =
            total /
            reviews.length;

    }


    document.getElementById(
        "averageRating"
    ).textContent =
        average.toFixed(1);


    document.getElementById(
        "averageStars"
    ).textContent =
        getStars(average);


    document.getElementById(
        "reviewCount"
    ).textContent =
        reviews.length +
        (
            reviews.length === 1
                ? " review"
                : " reviews"
        );


    /* EMPTY */

    const list =
        document.getElementById(
            "reviewsList"
        );


    if(reviews.length === 0){

        list.innerHTML = `
            <div class="empty">
                No approved reviews yet.
            </div>
        `;

        return;

    }


    /* REVIEW CARDS */

    list.innerHTML =
        reviews.map(
            function(item){

                return `
                    <div class="review">

                        <div class="review-head">

                            <div>

                                <div class="reviewer">
                                    ${escapeHTML(
                                        item.reviewer_name
                                    )}
                                </div>

                                <div class="review-stars">
                                    ${getStars(
                                        item.rating
                                    )}
                                </div>

                            </div>

                            <div class="date">
                                ${formatDate(
                                    item.created_at
                                )}
                            </div>

                        </div>

                        <div class="review-text">
                            ${escapeHTML(
                                item.review
                            )}
                        </div>

                    </div>
                `;

            }
        ).join("");

}


/* =========================================
   REVIEW FORM
========================================= */

document.getElementById(
    "reviewForm"
).addEventListener(
    "submit",
    submitReview
);


async function submitReview(event){

    event.preventDefault();


    const reviewerName =
        document.getElementById(
            "reviewerName"
        ).value.trim();


    const rating =
        Number(
            document.getElementById(
                "rating"
            ).value
        );


    const reviewText =
        document.getElementById(
            "reviewText"
        ).value.trim();


    const button =
        document.getElementById(
            "submitReview"
        );


    if(
        reviewerName.length < 2 ||
        reviewerName.length > 50
    ){

        showReviewMessage(
            "Name must be between 2 and 50 characters.",
            "error"
        );

        return;

    }


    if(
        !Number.isInteger(rating) ||
        rating < 1 ||
        rating > 5
    ){

        showReviewMessage(
            "Please select a rating from 1 to 5.",
            "error"
        );

        return;

    }


    if(
        reviewText.length < 3 ||
        reviewText.length > 500
    ){

        showReviewMessage(
            "Review must be between 3 and 500 characters.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Submitting...";


    const {
        error
    } =
        await supabaseClient
            .from("reviews")
            .insert({
                profile_id:profileId,
                reviewer_name:reviewerName,
                rating:rating,
                review:reviewText,
                status:"PENDING"
            });


    button.disabled = false;

    button.textContent =
        "Submit Review";


    if(error){

        console.error(
            "Submit review error:",
            error
        );


        showReviewMessage(
            "Failed to submit review. Please try again.",
            "error"
        );

        return;

    }


    document.getElementById(
        "reviewForm"
    ).reset();


    showReviewMessage(
        "Review submitted successfully! It will appear after admin approval.",
        "success"
    );

}


/* =========================================
   REVIEW MESSAGE
========================================= */

function showReviewMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "reviewMessage"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;

}

</script>

</body>
</html>
